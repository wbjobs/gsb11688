<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG 滤镜实验室</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>SVG 滤镜实验室</h1>
  <p class="sub">feGaussianBlur · feColorMatrix · feTurbulence · feDisplacementMap · feBlend / mix-blend-mode</p>
</header>

<div id="compatInfo" class="compat"></div>

<main>
  <section class="panel preview-panel">
    <div class="panel-title">
      预览
      <span class="mode-switch">
        渲染方式：
        <select id="renderMode">
          <option value="svg">SVG 滤镜</option>
          <option value="canvas">Canvas 降级</option>
        </select>
      </span>
    </div>
    <div class="preview-wrap">
      <svg id="previewSvg" viewBox="0 0 640 400" width="640" height="400"
           xmlns="http://www.w3.org/2000/svg">
        <defs id="filterDefs"></defs>
        <rect width="100%" height="100%" fill="#101418"/>
        <g id="layerA"></g>
        <g id="layerB"></g>
      </svg>
      <canvas id="previewCanvas" width="640" height="400" style="display:none"></canvas>
    </div>
    <div class="perf">
      <span>渲染耗时 <b id="perfTime">–</b></span>
      <span>帧率 <b id="perfFps">–</b></span>
      <span>开销评分 <b id="perfCost">–</b></span>
      <span id="perfHint" class="hint"></span>
    </div>
    <div class="blend-controls">
      <label>图层混合模式
        <select id="blendMode"></select>
      </label>
      <label>图层不透明度
        <input type="range" id="layerOpacity" min="0" max="1" step="0.01" value="1">
        <output id="opacityOut">1</output>
      </label>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">滤镜链（顺序影响结果，可上下调整）</div>
    <div class="add-row">
      <select id="filterType">
        <option value="blur">高斯模糊 feGaussianBlur</option>
        <option value="colorMatrix">颜色矩阵 feColorMatrix</option>
        <option value="turbulence">湍流噪声 feTurbulence</option>
        <option value="displacement">位移映射 feDisplacementMap</option>
        <option value="blend">混合 feBlend</option>
      </select>
      <button id="addFilter">＋ 添加</button>
    </div>
    <div id="chainList"></div>
  </section>

  <section class="panel">
    <div class="panel-title">预设（IndexedDB 持久化）</div>
    <div class="preset-save">
      <input type="text" id="presetName" placeholder="预设名称">
      <label class="chk"><input type="checkbox" id="overwritePreset"> 覆盖当前</label>
      <button id="savePreset">保存预设</button>
    </div>
    <div class="preset-builtin">
      <select id="builtinPreset"></select>
      <button id="applyBuiltin">应用内置预设</button>
    </div>
    <ul id="presetList"></ul>
  </section>

  <section class="panel">
    <div class="panel-title">导出</div>
    <button id="exportSvg">⬇ 导出 SVG 文件</button>
    <button id="copySvg">📋 复制 SVG 源码</button>
    <p class="note">导出的 SVG 为自包含文件（内联渐变与滤镜定义），可直接用浏览器打开。</p>
  </section>
</main>

<div id="toast"></div>

<script src="js/filterEngine.js"></script>
<script src="js/compat.js"></script>
<script src="js/scene.js"></script>
<script src="js/db.js"></script>
<script src="js/canvasRenderer.js"></script>
<script src="js/exporter.js"></script>
<script src="js/main.js"></script>
</body>
</html>
